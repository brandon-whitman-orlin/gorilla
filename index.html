<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gorilla Showdown!</title>
  </head>
  <body>
    <header>
      <p>Phaser Demo | Gorilla Showdown</p>
    </header>
    <main>
      <canvas id="gameCanvas"></canvas>
      <div id="ui">
        <button id="btn-play">Play</button>
        <button id="btn-spawn-man">Spawn Man</button>
        <button id="btn-spawn-gorilla">Spawn Gorilla</button>
        <button id="btn-clear">Clear Arena</button>
        <button id="btn-show-health">Show Health</button>
        <label for="sfx-volume">SFX Volume</label>
        <input type="range" id="sfx-volume" min="0" max="100" value="100">

        <label for="music-volume">Music Volume</label>
        <input type="range" id="music-volume" min="0" max="100" value="100">
      </div>
    </main>
    <footer>
      <p>Created by Brandon Whitman-Orlin</p>
    </footer>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
